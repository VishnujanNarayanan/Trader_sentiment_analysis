services:
  build:
    build: .
    volumes:
      - ./data:/data
    environment:
      TS_DATA_DIR: /data
      TS_DB_PATH: /data/trader_sentiment.db

  tests:
    build: .
    command: ["pytest", "-v"]

  app:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
    environment:
      TS_DATA_DIR: /data
